<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programa Depor - Instalador de Programas</title>
<link rel="stylesheet" href="comun/liquid-glass.css">
<link rel="stylesheet" href="comun/kit.css">
<link rel="stylesheet" href="instalador/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="lg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="38" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="wallpaper" aria-hidden="true">
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
</div>

<header class="titlebar" id="titlebar">
  <div class="brand"><span class="brand-icon"></span><span>Programa Depor · Instalador de Programas</span></div>
  <div class="win-controls">
    <button class="win-btn" data-win="min" aria-label="Minimizar"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
    <button class="win-btn" data-win="max" aria-label="Maximizar">
      <svg viewBox="0 0 12 12" class="ico-max"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.6"/></svg>
      <svg viewBox="0 0 12 12" class="ico-restore"><rect x="1.8" y="3.6" width="6.6" height="6.6" rx="1.4"/><path d="M4 3.6V2.8c0-.6.4-1 1-1h4.2c.6 0 1 .4 1 1V7c0 .6-.4 1-1 1h-.8"/></svg>
    </button>
    <button class="win-btn close" data-win="close" aria-label="Cerrar"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
  </div>
</header>

<main id="main" class="content" tabindex="-1"></main>

<nav class="tabbar-wrap" aria-label="Secciones">
  <div class="tabbar glass glass-lens" role="tablist">
    <span class="tab-indicator" aria-hidden="true"></span>
  </div>
</nav>

<div id="sheet-root"></div>
<script src="comun/kit.js"></script>
<script src="instalador/app.js"></script>
</body>
</html>
